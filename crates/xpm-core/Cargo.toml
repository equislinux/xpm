tar = { workspace = true }
zstd = { workspace = true }
flate2 = { workspace = true }
xz2 = { workspace = true }
sha2 = { workspace = true }
md-5 = { workspace = true }
glob = { workspace = true }
reqwest = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
