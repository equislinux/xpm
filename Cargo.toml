[workspace]
members = ["crates/xpm", "crates/xpm-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["xscriptor"]
repository = "https://github.com/equislinux/xpm"
description = "Modern Rust-based package manager for X Distribution"

[workspace.dependencies]
# CLI
clap = { version = "4", features = ["derive", "env", "color"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# System
libc = "0.2"

# Dependency resolution
resolvo = "0.10"
itertools = "0.14"

# Archive and compression
tar = "0.4"
zstd = "0.13"
flate2 = "1"
xz2 = "0.1"

# Cryptography
sha2 = "0.10"
sequoia-openpgp = { version = "1", default-features = false, features = ["crypto-rust", "allow-experimental-crypto", "allow-variable-time-crypto"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Network
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

# Internal crates
xpm-core = { path = "crates/xpm-core" }
